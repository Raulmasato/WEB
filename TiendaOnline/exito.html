<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>¡Pago exitoso! — ElectroJoule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="estilos.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark ej-navbar">
    <div class="container-xxl">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <span class="ej-logo-icon"><i class="bi bi-lightning-charge-fill"></i></span>
            <span class="fw-bold fs-5">ElectroJoule</span>
        </a>
    </div>
</nav>

<div class="container-xxl py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 text-center p-5">
                <div class="mb-4"><div class="ej-status-icon success mx-auto"><i class="bi bi-check-lg"></i></div></div>
                <h1 class="h3 fw-bold text-success mb-2">¡Pago exitoso!</h1>
                <p class="text-muted mb-4">Tu compra fue procesada correctamente. Recibirás un email con la confirmación.</p>
                <div class="card bg-light border-0 rounded-3 p-3 mb-4 text-start">
                    <div class="row g-2 small">
                        <div class="col-6 text-muted">N° de operación:</div><div class="col-6 fw-semibold">1234567890</div>
                        <div class="col-6 text-muted">Total abonado:</div><div class="col-6 fw-semibold">$20.200</div>
                        <div class="col-6 text-muted">Medio de pago:</div><div class="col-6 fw-semibold">Mercado Pago</div>
                    </div>
                </div>
                <a href="index.html" class="btn btn-primary btn-lg w-100"><i class="bi bi-grid me-2"></i>Seguir comprando</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
