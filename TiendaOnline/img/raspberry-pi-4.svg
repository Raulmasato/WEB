<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <rect width="480" height="340" fill="#0a0a1a"/>
  <!-- PCB -->
  <rect x="30" y="20" width="420" height="300" rx="8" fill="#1a1a4a" stroke="#2a2a7a" stroke-width="2"/>
  <!-- Main SoC (BCM2711) -->
  <rect x="180" y="100" width="100" height="100" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <text x="230" y="143" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">Broadcom</text>
  <text x="230" y="156" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">BCM2711</text>
  <text x="230" y="168" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">Cortex-A72 1.8GHz</text>
  <!-- RAM chip -->
  <rect x="185" y="55" width="80" height="35" rx="3" fill="#222" stroke="#444" stroke-width="1.5"/>
  <text x="225" y="70" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">LPDDR4</text>
  <text x="225" y="82" font-family="monospace" font-size="8" fill="#666" text-anchor="middle">2 GB RAM</text>
  <!-- USB3 ports -->
  <rect x="30" y="100" width="28" height="30" rx="2" fill="#1144aa" stroke="#2255cc" stroke-width="1.5"/>
  <rect x="30" y="136" width="28" height="30" rx="2" fill="#1144aa" stroke="#2255cc" stroke-width="1.5"/>
  <text x="44" y="119" font-family="monospace" font-size="7" fill="#88aaff" text-anchor="middle">USB3</text>
  <text x="44" y="155" font-family="monospace" font-size="7" fill="#88aaff" text-anchor="middle">USB3</text>
  <!-- USB2 ports -->
  <rect x="30" y="172" width="28" height="30" rx="2" fill="#444" stroke="#666" stroke-width="1.5"/>
  <rect x="30" y="208" width="28" height="30" rx="2" fill="#444" stroke="#666" stroke-width="1.5"/>
  <text x="44" y="191" font-family="monospace" font-size="7" fill="#aaa" text-anchor="middle">USB2</text>
  <text x="44" y="227" font-family="monospace" font-size="7" fill="#aaa" text-anchor="middle">USB2</text>
  <!-- HDMI ports -->
  <rect x="90" y="22" width="40" height="18" rx="2" fill="#333" stroke="#555" stroke-width="1.5"/>
  <rect x="140" y="22" width="40" height="18" rx="2" fill="#333" stroke="#555" stroke-width="1.5"/>
  <text x="110" y="35" font-family="monospace" font-size="7" fill="#aaa" text-anchor="middle">HDMI0</text>
  <text x="160" y="35" font-family="monospace" font-size="7" fill="#aaa" text-anchor="middle">HDMI1</text>
  <!-- USB-C power -->
  <rect x="200" y="22" width="24" height="14" rx="3" fill="#777" stroke="#555" stroke-width="1.5"/>
  <text x="212" y="33" font-family="monospace" font-size="6" fill="#fff" text-anchor="middle">5V</text>
  <!-- Ethernet -->
  <rect x="30" y="244" width="36" height="40" rx="2" fill="#555" stroke="#777" stroke-width="1.5"/>
  <text x="48" y="260" font-family="monospace" font-size="6" fill="#ccc" text-anchor="middle">GbE</text>
  <circle cx="38" cy="272" r="3" fill="#00cc00" opacity="0.9"/>
  <circle cx="48" cy="272" r="3" fill="#ffaa00" opacity="0.9"/>
  <!-- GPIO header -->
  <rect x="340" y="22" width="108" height="18" rx="2" fill="#111" stroke="#444" stroke-width="1"/>
  <g fill="#c8a000">
    <rect x="344" y="25" width="6" height="12" rx="1"/><rect x="354" y="25" width="6" height="12" rx="1"/>
    <rect x="364" y="25" width="6" height="12" rx="1"/><rect x="374" y="25" width="6" height="12" rx="1"/>
    <rect x="384" y="25" width="6" height="12" rx="1"/><rect x="394" y="25" width="6" height="12" rx="1"/>
    <rect x="404" y="25" width="6" height="12" rx="1"/><rect x="414" y="25" width="6" height="12" rx="1"/>
    <rect x="424" y="25" width="6" height="12" rx="1"/>
  </g>
  <!-- GPIO 2nd row -->
  <g fill="#c8c8c8">
    <rect x="344" y="37" width="6" height="2"/><rect x="354" y="37" width="6" height="2"/>
    <rect x="364" y="37" width="6" height="2"/><rect x="374" y="37" width="6" height="2"/>
    <rect x="384" y="37" width="6" height="2"/><rect x="394" y="37" width="6" height="2"/>
    <rect x="404" y="37" width="6" height="2"/><rect x="414" y="37" width="6" height="2"/>
    <rect x="424" y="37" width="6" height="2"/>
  </g>
  <!-- LED status -->
  <circle cx="420" cy="290" r="5" fill="#00ee00" opacity="0.9"/>
  <circle cx="435" cy="290" r="5" fill="#dd0000" opacity="0.9"/>
  <!-- MicroSD -->
  <rect x="400" y="295" width="40" height="22" rx="2" fill="#888" stroke="#666"/>
  <text x="420" y="310" font-family="monospace" font-size="7" fill="#333" text-anchor="middle">µSD</text>
  <!-- PCIe/CSI connectors -->
  <rect x="130" y="300" width="60" height="12" rx="1" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="220" y="300" width="60" height="12" rx="1" fill="#333" stroke="#555" stroke-width="1"/>
  <text x="160" y="310" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">CSI</text>
  <text x="250" y="310" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">DSI</text>
  <!-- Label -->
  <text x="300" y="230" font-family="monospace" font-size="11" fill="#4a4aaa" text-anchor="middle" font-weight="bold">Raspberry Pi 4</text>
  <text x="300" y="248" font-family="monospace" font-size="9" fill="#3a3a8a" text-anchor="middle">Model B · 2GB</text>
</svg>
