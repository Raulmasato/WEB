<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <rect width="480" height="340" fill="#1a2a1a"/>
  <!-- PCB -->
  <rect x="40" y="30" width="400" height="280" rx="8" fill="#1a4a1a" stroke="#2d7a2d" stroke-width="2"/>
  <!-- USB connector -->
  <rect x="40" y="120" width="28" height="48" rx="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <rect x="44" y="126" width="20" height="36" rx="2" fill="#444"/>
  <!-- Main chip ATmega328P -->
  <rect x="170" y="115" width="80" height="80" rx="4" fill="#222" stroke="#555" stroke-width="1.5"/>
  <text x="210" y="150" font-family="monospace" font-size="9" fill="#aaa" text-anchor="middle">ATmega</text>
  <text x="210" y="163" font-family="monospace" font-size="9" fill="#aaa" text-anchor="middle">328P</text>
  <!-- Chip pins left -->
  <g fill="#c8a000">
    <rect x="162" y="120" width="8" height="5" rx="1"/><rect x="162" y="130" width="8" height="5" rx="1"/>
    <rect x="162" y="140" width="8" height="5" rx="1"/><rect x="162" y="150" width="8" height="5" rx="1"/>
    <rect x="162" y="160" width="8" height="5" rx="1"/><rect x="162" y="170" width="8" height="5" rx="1"/>
    <rect x="162" y="180" width="8" height="5" rx="1"/>
  </g>
  <!-- Chip pins right -->
  <g fill="#c8a000">
    <rect x="250" y="120" width="8" height="5" rx="1"/><rect x="250" y="130" width="8" height="5" rx="1"/>
    <rect x="250" y="140" width="8" height="5" rx="1"/><rect x="250" y="150" width="8" height="5" rx="1"/>
    <rect x="250" y="160" width="8" height="5" rx="1"/><rect x="250" y="170" width="8" height="5" rx="1"/>
    <rect x="250" y="180" width="8" height="5" rx="1"/>
  </g>
  <!-- Power connector -->
  <rect x="100" y="32" width="60" height="18" rx="3" fill="#111" stroke="#555" stroke-width="1"/>
  <g fill="#666"><rect x="105" y="35" width="8" height="12" rx="1"/><rect x="117" y="35" width="8" height="12" rx="1"/>
  <rect x="129" y="35" width="8" height="12" rx="1"/><rect x="141" y="35" width="8" height="12" rx="1"/></g>
  <!-- Digital pin headers -->
  <rect x="320" y="32" width="18" height="200" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
  <g fill="#c8c8c8">
    <rect x="325" y="38" width="8" height="8" rx="1"/><rect x="325" y="52" width="8" height="8" rx="1"/>
    <rect x="325" y="66" width="8" height="8" rx="1"/><rect x="325" y="80" width="8" height="8" rx="1"/>
    <rect x="325" y="94" width="8" height="8" rx="1"/><rect x="325" y="108" width="8" height="8" rx="1"/>
    <rect x="325" y="122" width="8" height="8" rx="1"/><rect x="325" y="136" width="8" height="8" rx="1"/>
    <rect x="325" y="150" width="8" height="8" rx="1"/><rect x="325" y="164" width="8" height="8" rx="1"/>
    <rect x="325" y="178" width="8" height="8" rx="1"/><rect x="325" y="192" width="8" height="8" rx="1"/>
    <rect x="325" y="206" width="8" height="8" rx="1"/>
  </g>
  <!-- Analog headers -->
  <rect x="100" y="280" width="130" height="18" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
  <g fill="#c8c8c8">
    <rect x="106" y="284" width="8" height="10" rx="1"/><rect x="120" y="284" width="8" height="10" rx="1"/>
    <rect x="134" y="284" width="8" height="10" rx="1"/><rect x="148" y="284" width="8" height="10" rx="1"/>
    <rect x="162" y="284" width="8" height="10" rx="1"/><rect x="176" y="284" width="8" height="10" rx="1"/>
  </g>
  <!-- Crystal -->
  <ellipse cx="310" cy="160" rx="12" ry="22" fill="#888" stroke="#555" stroke-width="1"/>
  <text x="310" y="165" font-family="monospace" font-size="6" fill="#333" text-anchor="middle">16MHz</text>
  <!-- LEDs -->
  <circle cx="380" cy="90" r="5" fill="#00cc00" opacity="0.9"/>
  <circle cx="380" cy="106" r="5" fill="#ffaa00" opacity="0.9"/>
  <circle cx="380" cy="122" r="5" fill="#ff6600" opacity="0.9"/>
  <!-- Traces -->
  <path d="M 250 155 Q 290 155 310 138" stroke="#2d7a2d" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 250 170 Q 280 170 310 182" stroke="#2d7a2d" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 170 145 Q 140 145 100 140" stroke="#2d7a2d" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Label -->
  <text x="140" y="240" font-family="monospace" font-size="13" fill="#2d9a2d" font-weight="bold">Arduino</text>
  <text x="140" y="258" font-family="monospace" font-size="11" fill="#2d7a2d">Uno Rev3</text>
</svg>
