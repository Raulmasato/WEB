<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <rect width="480" height="340" fill="#0d1a0d"/>
  <!-- Module board -->
  <rect x="100" y="40" width="280" height="260" rx="6" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="2"/>
  <!-- ESP32 module (metal shield) -->
  <rect x="140" y="80" width="160" height="100" rx="4" fill="#888" stroke="#666" stroke-width="1.5"/>
  <rect x="146" y="86" width="148" height="88" rx="3" fill="#999"/>
  <!-- Espressif logo area -->
  <rect x="155" y="95" width="130" height="18" rx="2" fill="#777"/>
  <text x="220" y="108" font-family="sans-serif" font-size="9" fill="#ddd" text-anchor="middle">ESP-WROOM-32</text>
  <text x="220" y="148" font-family="monospace" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="220" y="165" font-family="monospace" font-size="8" fill="#555" text-anchor="middle">Xtensa LX6 240MHz</text>
  <!-- WiFi antenna trace -->
  <path d="M 285 90 L 300 90 L 300 80 L 295 80" stroke="#aaa" stroke-width="2" fill="none"/>
  <!-- USB-Micro connector -->
  <rect x="205" y="280" width="30" height="20" rx="2" fill="#777" stroke="#555" stroke-width="1"/>
  <rect x="210" y="283" width="20" height="14" rx="1" fill="#444"/>
  <!-- Pin headers left -->
  <rect x="102" y="75" width="12" height="200" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
  <g fill="#d4a000">
    <rect x="105" y="82" width="6" height="6" rx="1"/><rect x="105" y="94" width="6" height="6" rx="1"/>
    <rect x="105" y="106" width="6" height="6" rx="1"/><rect x="105" y="118" width="6" height="6" rx="1"/>
    <rect x="105" y="130" width="6" height="6" rx="1"/><rect x="105" y="142" width="6" height="6" rx="1"/>
    <rect x="105" y="154" width="6" height="6" rx="1"/><rect x="105" y="166" width="6" height="6" rx="1"/>
    <rect x="105" y="178" width="6" height="6" rx="1"/><rect x="105" y="190" width="6" height="6" rx="1"/>
    <rect x="105" y="202" width="6" height="6" rx="1"/><rect x="105" y="214" width="6" height="6" rx="1"/>
    <rect x="105" y="226" width="6" height="6" rx="1"/><rect x="105" y="238" width="6" height="6" rx="1"/>
    <rect x="105" y="250" width="6" height="6" rx="1"/>
  </g>
  <!-- Pin headers right -->
  <rect x="366" y="75" width="12" height="200" rx="2" fill="#111" stroke="#555" stroke-width="1"/>
  <g fill="#d4a000">
    <rect x="369" y="82" width="6" height="6" rx="1"/><rect x="369" y="94" width="6" height="6" rx="1"/>
    <rect x="369" y="106" width="6" height="6" rx="1"/><rect x="369" y="118" width="6" height="6" rx="1"/>
    <rect x="369" y="130" width="6" height="6" rx="1"/><rect x="369" y="142" width="6" height="6" rx="1"/>
    <rect x="369" y="154" width="6" height="6" rx="1"/><rect x="369" y="166" width="6" height="6" rx="1"/>
    <rect x="369" y="178" width="6" height="6" rx="1"/><rect x="369" y="190" width="6" height="6" rx="1"/>
    <rect x="369" y="202" width="6" height="6" rx="1"/><rect x="369" y="214" width="6" height="6" rx="1"/>
    <rect x="369" y="226" width="6" height="6" rx="1"/><rect x="369" y="238" width="6" height="6" rx="1"/>
    <rect x="369" y="250" width="6" height="6" rx="1"/>
  </g>
  <!-- EN and BOOT buttons -->
  <rect x="145" y="210" width="26" height="14" rx="3" fill="#cc0000"/>
  <rect x="180" y="210" width="26" height="14" rx="3" fill="#333" stroke="#555"/>
  <text x="158" y="221" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">EN</text>
  <text x="193" y="221" font-family="monospace" font-size="6" fill="#aaa" text-anchor="middle">BOOT</text>
  <!-- LED -->
  <circle cx="310" cy="218" r="5" fill="#0066ff" opacity="0.9"/>
  <!-- Label -->
  <text x="240" y="250" font-family="monospace" font-size="10" fill="#3a9a3a" text-anchor="middle">Wi-Fi + Bluetooth</text>
  <text x="240" y="265" font-family="monospace" font-size="9" fill="#3a7a3a" text-anchor="middle">Espressif Systems</text>
</svg>
