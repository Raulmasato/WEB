<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <rect width="480" height="340" fill="#1a1a2a"/>
  <!-- Sensor body -->
  <rect x="155" y="60" width="170" height="200" rx="10" fill="#2255aa" stroke="#3366cc" stroke-width="2"/>
  <!-- Ventilation holes (humidity mesh) -->
  <g fill="#1133aa" opacity="0.7">
    <rect x="170" y="80" width="140" height="80" rx="4"/>
  </g>
  <g fill="#3366cc" opacity="0.5">
    <!-- mesh pattern -->
    <line x1="180" y1="85" x2="180" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="192" y1="85" x2="192" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="204" y1="85" x2="204" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="216" y1="85" x2="216" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="228" y1="85" x2="228" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="240" y1="85" x2="240" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="252" y1="85" x2="252" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="264" y1="85" x2="264" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="276" y1="85" x2="276" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="288" y1="85" x2="288" y2="155" stroke="#88aaff" stroke-width="1"/>
    <line x1="300" y1="85" x2="300" y2="155" stroke="#88aaff" stroke-width="1"/>
    <!-- horizontal -->
    <line x1="170" y1="95" x2="310" y2="95" stroke="#88aaff" stroke-width="1"/>
    <line x1="170" y1="107" x2="310" y2="107" stroke="#88aaff" stroke-width="1"/>
    <line x1="170" y1="119" x2="310" y2="119" stroke="#88aaff" stroke-width="1"/>
    <line x1="170" y1="131" x2="310" y2="131" stroke="#88aaff" stroke-width="1"/>
    <line x1="170" y1="143" x2="310" y2="143" stroke="#88aaff" stroke-width="1"/>
  </g>
  <!-- IC chip inside -->
  <rect x="195" y="175" width="90" height="55" rx="3" fill="#111" stroke="#444" stroke-width="1.5"/>
  <text x="240" y="198" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">AM2302</text>
  <text x="240" y="212" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">AOSONG</text>
  <!-- pins -->
  <g fill="#c8a000">
    <rect x="179" y="270" width="10" height="35" rx="2"/>
    <rect x="205" y="270" width="10" height="35" rx="2"/>
    <rect x="265" y="270" width="10" height="35" rx="2"/>
    <rect x="291" y="270" width="10" height="35" rx="2"/>
  </g>
  <text x="184" y="318" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">VCC</text>
  <text x="210" y="318" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">DAT</text>
  <text x="270" y="318" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">NC</text>
  <text x="296" y="318" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">GND</text>
  <!-- Label -->
  <text x="240" y="50" font-family="monospace" font-size="13" fill="#4488ff" text-anchor="middle" font-weight="bold">DHT22</text>
  <text x="240" y="335" font-family="monospace" font-size="9" fill="#4466cc" text-anchor="middle">Temp &amp; Humidity Sensor</text>
</svg>
