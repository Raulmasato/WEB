<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <rect width="480" height="340" fill="#1a1a1a"/>
  <!-- 20 capacitors in 4x5 grid -->
  <!-- Template: cylindrical cap with stripe, 2 leads -->
  <defs>
    <linearGradient id="capBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3388"/><stop offset="40%" stop-color="#2244aa"/>
      <stop offset="60%" stop-color="#3355cc"/><stop offset="100%" stop-color="#1a3388"/>
    </linearGradient>
    <linearGradient id="capStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888"/><stop offset="50%" stop-color="#ccc"/><stop offset="100%" stop-color="#888"/>
    </linearGradient>
  </defs>
